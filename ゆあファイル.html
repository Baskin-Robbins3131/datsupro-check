<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f6f7">
  <title>脱獄ごっこPRO</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background: #f3f6f7;
      color: #161616;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    }
    .card {
      width: min(680px, 100%);
      background: #fff;
      border-radius: 28px;
      padding: 38px 34px 32px;
      box-shadow: 0 12px 36px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(30px, 5vw, 44px);
      letter-spacing: .02em;
    }
    .sub {
      margin: 0 0 28px;
      text-align: center;
      color: #666;
      font-size: 20px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 21px 8px;
      border-bottom: 1px solid #e9e9e9;
      font-size: clamp(22px, 4vw, 30px);
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .item:last-of-type { border-bottom: 0; }
    input[type="checkbox"] {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      accent-color: #218c4a;
    }
    .buttons {
      display: grid;
      gap: 13px;
      margin-top: 30px;
    }
    button, a.action {
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 19px 18px;
      font-size: 23px;
      font-weight: 750;
      text-align: center;
      text-decoration: none;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    #startBtn {
      display: block;
      background: #d9dce1;
      color: #91969e;
      pointer-events: none;
    }
    #startBtn.ready {
      background: #171717;
      color: #fff;
      pointer-events: auto;
    }
    #notYetBtn {
      background: #eef0f2;
      color: #333;
    }
    .hint {
      text-align: center;
      margin: 15px 0 0;
      color: #777;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>ゲームする前に確認！</h1>
    <p class="sub">今日やること、全部できた？</p>

    <label class="item">
      <input class="task" type="checkbox">
      <span>宿題終わった？</span>
    </label>

    <label class="item">
      <input class="task" type="checkbox">
      <span>学校の用意した？</span>
    </label>

    <label class="item">
      <input class="task" type="checkbox">
      <span id="thirdTaskText">水筒洗った？</span>
    </label>

    <div class="buttons">
      <a id="startBtn" class="action" aria-disabled="true">ゲームをはじめる</a>
      <button id="notYetBtn" type="button">まだ</button>
    </div>

    <p class="hint">3つ全部チェックしたらゲームをはじめられるよ</p>
  </main>

  <script>
    const shortcutURL = "shortcuts://run-shortcut?name=%E8%84%B1%E3%83%97%E3%83%AD%E8%B5%B7%E5%8B%95";
    const tasks = [...document.querySelectorAll(".task")];
    const startBtn = document.getElementById("startBtn");
    const thirdTaskText = document.getElementById("thirdTaskText");

    // JavaScriptの曜日: 日=0, 月=1, 火=2, 水=3, 木=4, 金=5, 土=6
    // 月〜木: 水筒 / 金〜日: 上靴
    const day = new Date().getDay();
    thirdTaskText.textContent = (day >= 1 && day <= 4) ? "水筒洗った？" : "上靴洗った？";

    function updateStartButton() {
      const allDone = tasks.every(task => task.checked);
      if (allDone) {
        startBtn.classList.add("ready");
        startBtn.href = shortcutURL;
        startBtn.setAttribute("aria-disabled", "false");
      } else {
        startBtn.classList.remove("ready");
        startBtn.removeAttribute("href");
        startBtn.setAttribute("aria-disabled", "true");
      }
    }

    function resetChecklist() {
      tasks.forEach(task => task.checked = false);
      updateStartButton();
    }

    tasks.forEach(task => task.addEventListener("change", updateStartButton));

    document.getElementById("notYetBtn").addEventListener("click", () => {
      resetChecklist();
      alert("先にやることを終わらせよう！");
    });

    // ページを開き直したときは毎回リセット
    window.addEventListener("pageshow", resetChecklist);

    updateStartButton();
  </script>
</body>
</html>
